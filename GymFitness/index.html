<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym&Fitness</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="site-header">
      <div class="company-logo-container">
        <img
          style="width: 300px; height: 200px"
          src="images/logo-2.png"
          alt="company logo"
        />
      </div>

      <nav class="nav">
        <ul>
          <li><a href="#" class="nav-link">Home</a></li>
          <li><a href="#" class="nav-link">Our Services</a></li>
          <li><a href="#" class="nav-link">About Us</a></li>
          <li><a href="#" class="nav-link">Contact Us</a></li>
          <li><a href="#" class="nav-link">Login</a></li>
        </ul>
      </nav>
    </header>

    <main class="hero">
      <section class="left-hero-section">
        <div class="headline-wrapper">
          <h2 class="hero-headline">
            <span class="highlight">Train</span> Smarter. <br />
            Live <span class="highlight">Stronger</span>
          </h2>
        </div>

        <div class="cta-wrapper">
          <p class="cta-text">YOUR BETTER VERSION STARTS TODAY!</p>
          <button type="button" class="cta-btn">Join Now</button>
        </div>
      </section>

      <section class="right-hero-section">
        <div class="tier-wrapper">
          <h3 class="tier-title">
            Join <br> for <span style="color: var(--orange-color);">FREE</span>
          </h3>
          <hr>
          <p class="tier-text">
            Then Rs 1000 per month
          </p>
        </div>
      </section>
      
      <!-- <p>This is hero section. Stronger today, Better tomorrow</p> -->
    </main>

    <footer>
      <p>&copy; 2026 All rights reserved.</p>
      <div class="social-icons"></div>
    </footer>
