<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="company-logo-container">
        <img
          src="images/logo-2.png"
          alt="PowerFit Fitness Club logo"
          class="logo"
        />
      </a>

      <nav class="nav">
        <ul>
          <li><a href="#" class="nav-link">Home</a></li>
          <li><a href="#" class="nav-link">Services</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="#" class="nav-link">Contact</a></li>
          <li><a href="#" class="nav-link">Login</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="contact-section">
        <div class="contact-info-container">
          <table>
            <caption>
              Contact Info
            </caption>
            <tbody>
              <tr>
                <td><i class="fa-solid fa-location-dot"></i></td>
                <td>Mauritius</td>
              </tr>
              <tr>
                <td><i class="fa-solid fa-phone"></i></td>
                <td>9876543</td>
              </tr>
              <tr>
                <td><i class="fa-brands fa-whatsapp"></i></td>
                <td>51234567</td>
              </tr>
              <tr>
                <td><i class="fa-solid fa-envelope"></i></td>
                <td>sample_mail@gmail.com</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="contact-form-container">
          <h2>Contact Us</h2>
          <p>or Leave us a message and we'll get back to you</p>

          <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
        </div>
      </section>
    </main>

    <footer>
      <div class="copyright-container">
        <p>&copy; 2026 PowerFit. All rights reserved.</p>
      </div>
      <div class="social-icons">
        <h4>Find us on:</h4>
        <div class="social-icons-container">
          <a href="#"><i class="fa-brands fa-facebook fb-icon"></i></a>
          <a href="#"><i class="fa-brands fa-instagram insta-icon"></i></a>
          <a href="#"><i class="fa-brands fa-twitter twitter-icon"></i></a>
          <a href="#"><i class="fa-brands fa-youtube youtube-icon"></i></a>
          <a href="#"><i class="fa-brands fa-tiktok tiktok-icon"></i></a>
        </div>
      </div>
    </footer>
  </body>
</html>
